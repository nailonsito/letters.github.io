    <a href="#" class="open-letter" data-letter="Hola cariño, no se ni como escribir una carta. Hace pechá (means a lot in Andalusian, en Madrid they use mazo. For example hace pechá calor) que no escribo una carta y no se ni por donde empezar así que simplemente voy a improvisar. No esperes ningún tipo de metáfora o frases complejas con poesía como tú, simplemente voy a escribir lo que me salga del nabo(Im gonna do whatever i want to do -> voy a hacer lo que me salga del nabo/de la polla/del coño)


Hola que tal hehe. He decidido hacerlo en español porque siento que me noto más suelto (I feel more free). Siempre he pensado que las cosas pasan por alguna razón. Si el día que nos conocimos hubieses decidido no venir al predrink probablemente ahora mismo no estaríamos juntos. Cada decisión que hemos tomado en nuestra vida he llevado a que tu y yo nos conociéramos. Siempre doy gracias a dios por tener salud en mi familia y lo que tengo en la vida pero ahora siempre le doy las gracias por haberte conocido. Cada vez que voy a la mezquita siempre pienso en ti y pido buena fortuna en tener un futuro juntos.
		
				
Se que parece que al haber tenido otras relaciones antes sepa más sobre relaciones pero sinceramente sigo aprendiendo todos los días. Es cierto que soy mucho mejor novio que cuando tenía 16-20 años porque en esa época era un desastre pero con experiencia he aprendido a ser mucha mejor persona y empatizar más con la gente. Aún así, siento que todavía no soy lo suficiente buen novio para hacerte feliz. Te trato muy bien, siempre que puedo te compro lo que necesites o te traigo lo que necesites. Te consuelo como puedo y te quiero de la mejor manera que se pero siento que tengo muchísimo que mejorar. Por ejemplo el tema de las flores, de verdad que hasta que no me lo dijiste no me di cuenta. Creo que es una mezcla entre tener mala memoria y que no puse suficiente atención en escuchar lo que decías. A partir de ahora te voy a intentar ser más atento con lo que pides y lo que necesitas y si alguna vez me tienes que decir quiero esto o necesito esto simplemente dilo. No porque me digas que necesitas algo significa que no te quiero, no te escucho o no te presto atención, simplemente soy un poco tonto.
		
				
No se ni cuanto más tengo que escribir o si he escrito lo suficiente no soy experto en esto. Creo que la distancia para mi no es un problema. Siempre he pensado que por la distancia mi relación anterior no funcionó, pero sinceramente algo dentro de mi pensaba que la relación no tendría futuro. Cuando la vi el otro día en cada de Oliver y después de escucharle hablar me acuerdo el por qué decidí cortar en su momento. Contigo siento una conexión que no había sentido antes. Es increíble la forma en la que somos tan similares en tantas cosas, tenemos gustos muy similares y lo más importante, un humor casi idéntico. Lo voy a decir una vez en mi vida así que guarda este mensaje: sí pienso que eres graciosa. Yo no podría estar con una persona que aunque esté buena no me haga reír y contigo me río todos los días (sobretodo me río de ti pero bueno).
		
				
Siento mucho haber tardado tanto en enviarte una “carta” pero es que no se que decir. Seguramente para ti ha sido muy poco texto pero no había escrito tanto desde Bachillerato. Intentaré no tardar mucho en escribirte otra (sí voy a tardar). Cada día que pasa me enamoró cada vez más de ti, no podría haber elegido mejor pareja para pasar el resto de los días. Te amo mi amor.
		
				
Niloy.">

    <a href="#" class="open-letter" data-letter="Hola cariño hehe. Como estás? Te duele la pierna? Espero que estés mejor. Hace mucho que no te escribo perdona estaba ocupado (no). 


Nueve meses vaya locura, parece como si fuera ayer cuando te conocí el common room de Wardley. Contigo el tiempo pasa rápido y lento al mismo tiempo. Cuando estamos juntos siento que el tiempo se para y solo somos nosotros dos pero a la vez parpadeo una vez y pasa una semana entera (no entiendo nada).
	
		
Las veces que te digo que te amo o te echo de menos no representan todo lo que te amo y te echo de menos. Llegaste de repente e hiciste mi vida mucho más feliz. Mis días siempre son monótonos, aburridos y repetitivos pero aún así me levanto con una sonrisa porque se que por la noche nos vamos a llamar. 
	
		
Nunca llegue a pensar que una relación a distancia podría ser tan llevadera(it was this doable). Tenerte a mi lado hace que mi vida sea más divertida. Contigo estaría dispuesto a tener una distant relationship de hasta 5 años si hiciera falta (espero que no). 
	
	
Estar contigo es lo que más feliz me hace en la vida, es muy fácil tener alguien a tu lado a la que amas tanto, entiendes tanto y te conoce tan bien (a veces estás loca y lloras pero me he acostumbrado a eso y nunca voy a dejarte pinky promise). La conexión que tengo contigo no la he tenido nunca con nadie, eres mi media naranja (a way in Spanish to say you are my other half). Nos complementamos el uno al otro perfectamente y creo que de eso va tener una relación. 
	
	
No te preocupes mucho por lo de estudiar Química, si Dios lo ha querido así será por algo. Da igual como lo intente yo se que vamos a acabar juntos así que no pienses mucho en ello. Hasta el Lunes no sabes la respuesta pero verás que todo va a estar bien.

    <a href="#" class="open-letter" data-letter="Hola cariño, feliz aniversario! Creo que ha sido el año que más rápido ha pasado en mi vida. Nunca pensé que el amor de mi vida lo iba a encontrar en el common room de Wardley.

    Hay momentos randoms que se me vienen a la cabeza cuando pienso en este año juntos. Como cuando fuimos al cumple de Cuban y nos puso al japonés raro al lado nuestro, que puto pesado era. O cuando fuimos a back room y acabé vomitando en diferentes puntos estratégicos para marcar el territorio con mi vomito. Cuando fuimos a Mánchester y casi te desmayas por ver la boda esa rara en la calle porque era como un fever dream. Cuando fuimos a Londres y nos teníamos que ir por la mañana rápido, quedaba 10 minutos y teníamos que terminar rápido. Son las cosas que se me vienen así de repente a la cabeza y solo en un año. No me quiero ni imaginar la de anécdotas e historias que vamos a vivir juntos en los siguientes años.
    

    Hace ya más de un año que nos conocemos pero siento que te conozco desde mucho antes. Nunca he tenido una conexión tan genuina con nadie en mi vida. Me parece espectacular que podamos siempre pensar y decir las mismas palabras o pensar de la misma forma en situaciones tan randoms. Es algo que se consigue con un amigo de la infancia con la que has convivido muchos años pero tú y yo solo nos conocemos desde hace un año y míranos lo conectado que estamos.
    

    Siempre doy gracias a dios cuando voy a rezar por haberte puesto en mi vida. Antes pedía un trabajo o tener suerte en alguna entrevista pero hoy en día simplemente doy gracias por lo que tengo. Una familia saludable, comida y una futura esposa a la que quiero más que a mi vida. Hasta ahora no creía en los milagros pero siento que conocerte ha sido uno de ellos, porque ha sido una de las mayores suertes de mi vida. Hay personas que matarían por tener a alguien como tú a su lado y yo te tengo gracias a dios (y a mi rizz).

  <!-- Modal -->
  <div id="letterModal" class="modal">
    <div class="modal-content">
      <span class="close-button">&times;</span>
      <div class="letter-text" id="letterText">
        <!-- Letter content will appear here -->
      </div>
    </div>
  </div>

  <audio id="clickSound" src="assets/sounds/audio.mp3" preload="auto"></audio>


  <!-- Script -->
  <script>
    const modal = document.getElementById('letterModal');
    const modalText = document.getElementById('letterText');
    const closeBtn = document.querySelector('.close-button');
    const clickSound = document.getElementById('clickSound');

    document.querySelectorAll('.open-letter').forEach(link => {
      link.addEventListener('click', function(e) {
        e.preventDefault();
        const letter = this.getAttribute('data-letter');
        document.getElementById('letterText').textContent = letter;
        document.getElementById('letterModal').style.display = 'flex';
        // Play click sound
        clickSound.currentTime = 0; // rewind to start
        clickSound.play();
      });
    });

    // Click on image
    document.querySelectorAll('.open-letter').forEach(link => {
      link.addEventListener('click', function(e) {
        e.preventDefault();
        const letter = this.getAttribute('data-letter');
        modalText.textContent = letter;
        modal.style.display = 'flex';
      });
    });

    // Close modal
    closeBtn.addEventListener('click', () => {
      modal.style.display = 'none';
    });

    // Click outside modal to close
    window.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.style.display = 'none';
      }
    });
  </script>
